spring.application.name=Neural-docker-selective-backend

# Database configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/neuraldb
spring.datasource.username=neuraluser
spring.datasource.password=neuralpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT configuration
# No default on purpose: a literal here would be public (it is in the GitHub repo).
# SecretsValidator refuses to start the app if this is empty, weak, or a known default.
application.security.jwt.secret-key=${JWT_SECRET:}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

#port
server.port=8080

# Microservices configuration
microservice.monitor.port=8001

# Service token for internal services (ngrok monitor, system monitor) 
# Change this to a long random string in production 
# Supplied via the SERVICE_TOKEN env var (see docker-compose.yml). No default on purpose.
service.token=${SERVICE_TOKEN:}
 
# AI service hostname — use Docker service name so backend can reach it inside the network
microservice.gateway.host=ai-service
# Gateway port for ai-service proxy 
microservice.gateway.port=8000
