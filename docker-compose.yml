services:

  postgres:
    image: postgres:16
    container_name: neural_postgres
    environment:
      POSTGRES_DB: neuraldb
      POSTGRES_USER: neuraluser
      POSTGRES_PASSWORD: neuralpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuraluser -d neuraldb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./Backend/Neural-docker-selective-backend
    container_name: neural_backend
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/neuraldb
      SPRING_DATASOURCE_USERNAME: neuraluser
      SPRING_DATASOURCE_PASSWORD: neuralpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Secrets are REQUIRED and have no fallback: a default would be public (it would
      # live in this repo). run.bat / setup.sh generate them into .env automatically.
      # SERVICE_TOKEN must match the one given to ngrok-monitor below.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is not set - run run.bat or setup.sh, or see .env.example}
      # Machines in the same cluster must share the same JWT_SECRET (base64, >= 32 bytes).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run run.bat or setup.sh, or see .env.example}
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: neural_pgadmin
    restart: no
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@neural.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  system-monitor:
    build:
      context: ./system-monitor
    container_name: neural_system_monitor
    ports:
      # Bound to this machine only: the system monitor has no authentication of its own, and
      # only the local browser and the ai-service container (over the docker network) need it.
      - "127.0.0.1:8001:8001"
    volumes:
      # Persist recordings across container restarts
      - recordings_data:/app/recordings
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: neural_ai_service
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
      # Share recordings volume so ai-service can proxy recording endpoints
      - recordings_data:/app/recordings
    environment:
      # The AI service authenticates every request with a JWT signed by this shared secret
      # (audit finding S3). Required: the container refuses to start without a valid one.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set - run run.bat or setup.sh, or see .env.example}
      - MONITOR_URL=http://system-monitor:8001
      # Controls CPU sampling rate for stats (higher = smoother graphs)
      - STATS_SAMPLE_INTERVAL=0.5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      - system-monitor

  frontend:
    build:
      context: ./Frontend
      # These are build ARGs, not runtime env vars — Vite bakes them into the
      # JS bundle during `npm run build`, which happens in an earlier stage
      # that never sees this service's `environment:`. If you change these,
      # rebuild the frontend container (`--build`, not just `up`).
      args:
        VITE_API_URL: http://localhost:8081
        VITE_AI_API_URL: http://localhost:8000
    container_name: neural_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: neural_ngrok
    command: start --all --config /etc/ngrok/ngrok.yml --log=stdout
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    volumes:
      - ./Ngrok/ngrok-docker.yml:/etc/ngrok/ngrok.yml
    depends_on:
      - ai-service
      - backend
    restart: unless-stopped

  ngrok-monitor:
    build:
      context: ./Ngrok
    container_name: neural_ngrok_monitor
    environment:
      - BACKEND_URL=http://backend:8080
      - SERVICE_TOKEN=${SERVICE_TOKEN:?SERVICE_TOKEN is not set - run run.bat or setup.sh, or see .env.example}
      - NGROK_API_URL=http://ngrok:4040/api/tunnels
    depends_on:
      - ngrok
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  recordings_data: